name: publish
on:
  push:
    branches: [main]
    paths: ["project.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    uses: benchx-dev/benchx-ci/.github/workflows/publish.yml@main

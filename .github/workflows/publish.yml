name: publish
on:
  push:
    branches: [main]
    paths: ["project.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    uses: benchx-dev/benchx-ci/.github/workflows/publish.yml@main
    with:
      # Temporary pin until benchx #131, #137, and #140 are merged and released on PyPI.
      benchx_spec: "benchx[parquet] @ git+https://github.com/rok/benchx.git@660f501"
      views_format: "parquet"

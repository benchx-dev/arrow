name: command
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
jobs:
  command:
    if: >-
      contains(github.event.comment.body, '@github-actions bench') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: benchx-dev/benchx-ci/.github/workflows/command.yml@main
    with:
      comment_body: ${{ github.event.comment.body }}
      issue_number: ${{ format('{0}', github.event.issue.number) }}

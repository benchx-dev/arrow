name: bench
run-name: bench ${{ inputs.sha }} ${{ inputs.machine }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The Arrow commit to measure
        required: true
      machine:
        description: A machine name from machines.json
        default: amd64-c6a-4xlarge-linux
      suite_filter:
        description: A regex over benchmark binaries; "." runs all of them
        default: "."
      budget_minutes:
        description: Stop starting new benchmark binaries after this many minutes
        default: "240"
concurrency:
  group: bench-${{ inputs.sha }}-${{ inputs.machine }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  actions: write
jobs:
  bench:
    uses: benchx-dev/benchx-ci/.github/workflows/bench.yml@main
    with:
      sha: ${{ inputs.sha }}
      machine: ${{ inputs.machine }}
      suite_filter: ${{ inputs.suite_filter }}
      budget_minutes: ${{ inputs.budget_minutes }}
      configuration: cpp
      setup_script: provider/setup-env.sh
      run_wrapper: provider/run-in-env.sh
      discover_script: provider/discover.sh
      post_run_script: provider/sccache-stats.sh
      # Temporary pin until benchx #131, #137, and #140 are merged and released on PyPI.
      benchx_spec: "benchx[parquet] @ git+https://github.com/rok/benchx.git@660f501"
    secrets: inherit

name: schedule
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be dispatched
        type: boolean
        default: false
concurrency:
  group: schedule
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true'
    uses: benchx-dev/benchx-ci/.github/workflows/schedule.yml@main
    with:
      dry_run: ${{ inputs.dry_run || false }}
